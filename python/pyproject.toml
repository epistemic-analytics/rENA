[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qe-ena"
version = "0.1.5"
description = "Python ENA (Epistemic Network Analysis) modeling — sister package to rENA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qe-lib>=0.1.3",
    "numpy>=1.24",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
# The distribution is "qe-ena" but the import package is "ena"; hatchling
# would otherwise look for a qe_ena/ directory.
packages = ["ena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
