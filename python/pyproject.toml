[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyENA"
version = "0.1.1"
description = "Python ENA (Epistemic Network Analysis) modeling — sister package to rENA"
requires-python = ">=3.10"
dependencies = [
    "pylibqe",
    "numpy>=1.24",
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
