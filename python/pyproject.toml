[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=1.9"]
build-backend = "scikit_build_core.build"

[project]
name = "qe-ena"
version = "0.1.6"
description = "Python ENA (Epistemic Network Analysis) modeling — sister package to rENA"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "Cody L Marquart", email = "cody.marquart@wisc.edu" }]
dependencies = [
    # qe-lib is 0.x: a minor bump may change its API. 0.1.7 is the first
    # release published as qe-lib (import qe); earlier ones were pylibqe.
    "qe-lib>=0.1.7,<0.2",
    "numpy>=1.24",
    "pandas>=1.5",
]

[project.urls]
Homepage = "https://qe-libs.org/py/project/qe-ena/"
Source = "https://gitlab.com/epistemic-analytics/qe-packages/rENA/-/tree/main/python"
Issues = "https://gitlab.com/epistemic-analytics/qe-packages/rENA/-/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.scikit-build]
cmake.source-dir = "."
# The distribution is "qe-ena" but the import package is "ena" (with the
# libena extension, ena._libena).
wheel.packages = ["ena"]
# A fixed build dir instead of a temp one: on Windows, deleting the temp build
# dir races with handles still held open (WinError 32) and fails the build.
build-dir = "build/{wheel_tag}"
# include/ is git-ignored (vendored by scripts/sync-headers.sh) but must ship
# in the sdist; build/ must not.
sdist.include = ["include/"]
sdist.exclude = ["build/", ".pytest_cache/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
