[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qe-ena"
version = "0.1.6"
description = "Python ENA (Epistemic Network Analysis) modeling — sister package to rENA"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "Cody L Marquart", email = "cody.marquart@wisc.edu" }]
dependencies = [
    # qe-lib is 0.x: a minor bump may change its API. 0.1.7 is the first
    # release published as qe-lib (import qe); earlier ones were pylibqe.
    "qe-lib>=0.1.7,<0.2",
    "numpy>=1.24",
    "pandas>=1.5",
]

[project.urls]
Homepage = "https://qe-libs.org/py/project/qe-ena/"
Source = "https://gitlab.com/epistemic-analytics/qe-packages/rENA/-/tree/main/python"
Issues = "https://gitlab.com/epistemic-analytics/qe-packages/rENA/-/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
# The distribution is "qe-ena" but the import package is "ena"; hatchling
# would otherwise look for a qe_ena/ directory.
packages = ["ena"]

[tool.hatch.build.targets.sdist]
include = ["ena", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
