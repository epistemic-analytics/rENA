destination: public/
navbar:
  title: "rENA"
  type: inverse
  left:
    - text: "Home"
      href: index.html
    - text: "Reference"
      href: "reference/"
    - text: "Changelog"
      href: "news/"
    - text: "Coverage"
      href: "coverage/"
  right:
    - icon: fa-gitlab
      href: https://gitlab.com/epistemic-analytics/qe-packages/rena/

reference:
  # ── Pipeline API (new) ────────────────────────────────────────────────────
  - title: "Pipeline"
    desc: >
      The pipe-oriented API for building ENA models step by step.
      Each function returns an object that can be passed to the next stage.
    contents:
      - accumulate
      - sphere_norm
      - center
      - rotate
      - project
      - optimize
      - model

  # ── Rotation methods ──────────────────────────────────────────────────────
  - title: "Rotation Methods"
    desc: >
      Rotation strategies that can be passed to `rotate()`. Each returns a
      rotation matrix aligned to a meaningful axis in ENA space.
    contents:
      - ena.rotate.by.svd
      - ena.rotate.by.mean
      - ena.rotate.by.generalized
      - ena.rotate.by.hena.regression
      - ena.rotate.by.hena.regression_2
      - ena.rotation.h
      - gmr
      - means_rotate

  # ── Plotting ──────────────────────────────────────────────────────────────
  - title: "Plotting"
    desc: Functions for visualising ENA models and networks.
    contents:
      - ena.plot
      - ena.plotter
      - matches("add_")
      - matches("ena.plot")
      - ena.plot.interactive
      - enaInteractiveOutput
      - renderEnaInteractive
      - ena.export.html

  # ── Window Size Estimation ────────────────────────────────────────────────
  - title: "Window Size Estimation"
    desc: Functions for estimating and tuning moving conversation window sizes.
    contents:
      - ena.ccd.window
      - ena.ccd
      - ena.gd.window
      - ena.ground.diversity
      - ena.tune.window.size

  # ── Legacy API ────────────────────────────────────────────────────────────
  - title: "Legacy API"
    desc: >
      Original single-function API (`ena()`, `ena.accumulate.data()`, etc.).
      Still supported; prefer the pipeline API for new work.
    contents:
      - ena
      - starts_with("ena.accumulate")
      - ena.make.set
      - ena.group
      - ena.svd
      - ena.conversations
      - ena.correlations
      - ena.writeup
      - ena_space_dist_corr
      - connection.matrix

  # ── Data ──────────────────────────────────────────────────────────────────
  - title: "Data"
    contents:
      - RS.data

  # ── Internal / utilities ──────────────────────────────────────────────────
  - title: internal
    contents:
      - ENARotationSet
      - ENAdata
      - ENAset
      - ENAplot
      - as.ena.co.occurrence
      - as.ena.matrix
      - as.ena.metadata
      - as.matrix.ena.connections
      - as.matrix.ena.line.weights
      - as.matrix.ena.matrix
      - as.matrix.ena.nodes
      - as.matrix.ena.points
      - as.matrix.ena.rotation.matrix
      - as.matrix.row.connections
      - as_trajectory
      - $.ena.matrix
      - $.ena.metadata
      - $.ena.points
      - $.line.weights
      - clear
      - directed_node_positions
      - directed_node_positions_with_ground_response_added
      - ena_correlation
      - find_binary_cols
      - find_code_cols
      - find_dimension_cols
      - find_meta_cols
      - fun_cohens.d
      - fun_skip_sphere_norm
      - fun_sphere_norm
      - merge_columns_c
      - methods_report
      - methods_report_stream
      - move_nodes_to_unit_circle
      - move_nodes_to_unit_circle_with_equal_space
      - namesToAdjacencyKey
      - project_in
      - remove_meta_data
      - show
      - vector_to_ut
      - with_means
      - with_trajectory
