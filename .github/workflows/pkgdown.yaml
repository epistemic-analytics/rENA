on:
  push:
    branches: unknown
name: Pkgdown
jobs:
  pkgdown:
    runs-on: ubuntu-16.04
    container:
      image: egruw/qe-pkgdown:latest
    steps:
      - uses: actions/checkout@master
      - name: Install package
        run: R CMD INSTALL .
      - name: Configure git
        run: |
          git config --global user.name runner
          git config --global user.email runner
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic ${{ secrets.GITHUB_TOKEN }}"
      - name: Deploy package
        run: |
          pkgdown:::deploy_local(new_process = FALSE, remote_url = 'https://x-access-token:${{secrets.DEPLOY_PAT}}@github.com/${{github.repository}}.git');
        shell: Rscript {0}
      - name: Test coverage
        run: |
          Rscript -e 'install.packages(c("covr"))' \
                  -e 'dest_dir=fs::dir_create(fs::file_temp()); on.exit(fs::dir_delete(dest_dir)); clnd=pkgdown:::git( "clone", "--single-branch", "-b", "gh-pages", "--depth", "1", "https://x-access-token:${{secrets.DEPLOY_PAT}}@github.com/epistemic-analytics/rENA.git", dest_dir ); covr::report(file = paste0(dest_dir, "/coverage/index.html")); pkgdown:::github_push(dest_dir, pkgdown:::construct_commit_message("."));'

