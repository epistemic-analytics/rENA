stages:
  - build
  - test

# ── shared pip cache ──────────────────────────────────────────────────────────
.pip-cache: &pip-cache
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.pip-cache]
    policy: pull-push

.wasm-conan-cache: &wasm-conan-cache
  cache:
    key: conan2-wasm-$CI_COMMIT_REF_SLUG
    paths: [wasm/.conan2]
    policy: pull-push

# ── rena-wasm's libena module (C++ → WASM), as libqe's build:wasm ───────────
# test:wasm (from cranqe's npm-registry.yml template) consumes wasm/dist/.
build:wasm:
  stage: build
  image: emscripten/emsdk:latest
  variables:
    # Conan's home inside the project dir so the cache can keep Armadillo.
    CONAN_HOME: "$CI_PROJECT_DIR/wasm/.conan2"
  <<: *wasm-conan-cache
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends ninja-build
    - pip install conan --quiet --break-system-packages
    - conan profile detect --force
  script:
    - sh wasm/scripts/build.sh
  artifacts:
    paths: [wasm/dist/]
    expire_in: 1 day

# ── R package tests ───────────────────────────────────────────────────────────
test:r:
  stage: test
  needs: []   # don't wait for build:wasm
  image: rocker/r-ver:4.5.0
  variables:
    TMA_REF: develop
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        build-essential gfortran git
        libxml2-dev libcurl4-openssl-dev libssl-dev
        libopenblas-dev liblapack-dev
    - Rscript -e "install.packages(
        c('R6', 'data.table', 'glmnet', 'scales', 'plotly',
          'testthat', 'knitr', 'rmarkdown',
          'Rcpp', 'RcppArmadillo', 'libqe', 'tma'),
        repos = c(
          'https://qe-libs.org/cran-dev/',
          'https://qe-libs.org/cran/',
          'https://packagemanager.posit.co/cran/__linux__/noble/latest'
        ),
        quiet = TRUE)"
    # rENA needs tma >= 0.3.6 (accumulation moved from libqe), which is on
    # tma's develop branch and not yet published; install it from there.
    # (tma is private; its job-token allowlist admits the epistemic-analytics
    # group.)  Once it is on qe-libs.org, drop these two lines.
    - git clone --depth 1 --branch "$TMA_REF"
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/epistemic-analytics/qe-packages/tma.git" /tmp/tma
    - R CMD INSTALL /tmp/tma
  script:
    - R CMD INSTALL .
    - Rscript -e "testthat::test_local('.', reporter = 'progress')"

# ── Python package tests (qe-ena) ─────────────────────────────────────────────
test:python:
  stage: test
  needs: []   # don't wait for build:wasm
  image: python:3.12-slim
  <<: *pip-cache
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends build-essential cmake libarmadillo-dev
    # Public dependencies from PyPI, then qe-lib from qe-libs.org *only*:
    # --extra-index-url would let pip pick a same-named, higher-versioned
    # package from PyPI instead (qe-lib is not claimed there).
    - pip install --cache-dir .pip-cache numpy pandas pytest
    - pip install --cache-dir .pip-cache --no-deps
        --index-url https://qe-libs.org/py/dev/simple/ qe-lib
  script:
    # ena._libena builds against headers vendored into python/include/
    # (libena from inst/include, libqe from Conan).
    - sh scripts/sync-headers.sh
    - cd python
    - pip install --cache-dir ../.pip-cache ".[dev]"
    # importlib mode tests the installed package: the source tree has no
    # compiled ena._libena.
    - pytest tests/ -v --import-mode=importlib

# ── wasm package tests ────────────────────────────────────────────────────────
# The rest of the job (image, registry setup, script) comes from cranqe's
# npm-registry.yml template.
test:wasm:
  needs: [build:wasm]

# ── cranqe integration ────────────────────────────────────────────────────────
# verify-tag-version (.pre, tags):  confirm git tag == DESCRIPTION Version
# trigger-cranqe     (.post, main): request a dev build after every push
# trigger-cranqe-release (.post, tags): request a release build after a tag
include:
  - project: 'epistemic-analytics/qe-packages/cranqe'
    ref: main
    file: '/ci-templates/trigger-cranqe.yml'
  - project: 'epistemic-analytics/qe-packages/cranqe'
    ref: main
    file: '/ci-templates/npm-registry.yml'
