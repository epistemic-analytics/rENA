stages:
 - test
 - buildAPI

variables:
  DEV_HOST: "34.212.25.148"
  STAGING_HOST: "54.201.134.99"
  LIVE_HOST: "54.218.105.250"

before_script:
  - apt-get update -qq
  - apt-get install -y --no-install-recommends libcurl4-openssl-dev libssh2-1-dev libssl-dev git libxml2-dev xml2
  - apt-get install -y --no-install-recommends qpdf pandoc pandoc-citeproc openssh-client
  - export _R_CHECK_CRAN_INCOMING_=FALSE
  - export _R_CHECK_FORCE_SUGGESTS_=TRUE

cache:
  paths:
  - /usr/local/lib/R/site-library

r-oldrel:
  stage: test
  image: r-base:3.5.1
  only:
    - master
  script:
    - Rscript -e 'install.packages(c("devtools", "roxygen2"))'
    - Rscript -e 'devtools::clean_dll()'
    - Rscript -e 'devtools::install_dev_deps()'
    - Rscript -e 'Rcpp::compileAttributes()'
    - Rscript -e 'devtools::build(".")'
    - ls -al ../
    - cd ..; R CMD check --as-cran rENA_0.1.6.tar.gz || true
    - ls -al ../
    - cat ../rENA.Rcheck/00check.log
    - cat ./rENA.Rcheck/00check.log
  tags:
    - docker
  allow_failure: true
