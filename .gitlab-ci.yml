stages:
  - test
  - build
  - deploy
before_script:
  - docker info
build_image:
  script:
    - docker build -t r-package-builder inst/docker/
#  - docker run r-package-builder
image: r-package-builder
test:
  stage: test
  tags:
    - R-package
  script:
    - echo "Running tests."
    - R CMD build . --no-build-vignettes --no-manual
    - PKG_FILE_NAME=$(ls -1t *.tar.gz | head -n 1)
    - R CMD check "${PKG_FILE_NAME}" --no-build-vignettes --no-manual --as-cran
