stages:
 - test
 - buildAPI

variables:
  DEV_HOST: "34.212.25.148"
  STAGING_HOST: "54.201.134.99"
  LIVE_HOST: "54.218.105.250"

before_script:
  #- apt-get update -qq
  #- apt-get install -y --no-install-recommends libcurl4-openssl-dev libssh2-1-dev libssl-dev git libxml2-dev xml2
  #- apt-get install -y --no-install-recommends qpdf pandoc pandoc-citeproc openssh-client
  - export _R_CHECK_CRAN_INCOMING_=FALSE
  - export _R_CHECK_FORCE_SUGGESTS_=TRUE

r-oldrelease:
  stage: test
  image: egruw/rena-r-oldrelease:latest
  only:
    - master
  script:
    - rm -f ./R/RcppExports.R
    - R --version
    #- Rscript -e 'install.packages("git2r","usethis","devtools","testthat")'
    #- Rscript -e 'update(devtools::dev_package_deps("."))'
    - Rscript -e 'Sys.info()'
    #- Rscript -e 'Rcpp::compileAttributes()'
    - cd ..; R CMD build rENA || true
    - R CMD check --as-cran rENA_0.1.6.tar.gz
    - cat ./rENA.Rcheck/00check.log || true
    - cat ./rENA.Rcheck/00install.out || true
  tags:
    - docker
  allow_failure: false
