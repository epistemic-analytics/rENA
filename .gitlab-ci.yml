cache:
  paths:
  - /usr/local/lib/R/site-library

r-devel:
  stage: test
  image: rocker/r-devel:latest
  cache:
    paths:
    - /usr/local/lib/R/site-library
  only:
   - develop
  script:
    - RDscript -e 'install.packages(c("devtools", "stringi", "roxygen2"))'
