stages:
 - docker
 - check
 - checkWindows
 - release

variables:
  VERSION: "0.1.6.1"
  PKG: "rENA"
  PKGL: "rena"
  REG_URL: "registry.doit.wisc.edu/clmarquart/rena"

# Templates
.build_definition: &build_template
  before_script:
    - export _R_CHECK_CRAN_INCOMING_=FALSE
    - export _R_CHECK_FORCE_SUGGESTS_=TRUE
    - mkdir -p build/
    - rm -f ./R/RcppExports.R
    - mkdir -p ~/.R/
    - rm -f ~/.R/Makevars
    - cp demo/backup/Makevars ~/.R/
    - cat ~/.R/Makevars
    - Rscript -e 'Rcpp::compileAttributes()'
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - Rscript -e 'install.packages("webshot", repos = "https://cran.rstudio.com")'
    #- Rscript -e 'devtools::build_vignettes()' || true
    - cd ..; R CMD build --resave-data --no-manual --log rENA || true
.check_definition: &check_template
  stage: check
  artifacts:
    paths:
      - build/
      - doc/
      - inst/doc/
    expire_in: 1 week
  <<: *build_template
  script:
    - R --no-site-file --no-environ --no-save --no-restore --quiet CMD check rENA_$VERSION.tar.gz --as-cran --no-manual
    - ls -al ./
    - ls -al ./rENA.Rcheck/
    - mv ./rENA-00build.log rENA/build/ || true
    - mv ./rENA.Rcheck/00check.log rENA/build/ || true
    - mv ./rENA.Rcheck/00install.out rENA/build/ || true
    - mv ./rENA_$VERSION.tar.gz rENA/build/
  tags:
    - docker
  allow_failure: false

# Check Steps
check:r-devel:
  image: $REG_URL/devel:current
  only:
    - master
  <<: *check_template
check:r-oldrelease:
  image: $REG_URL/old-release:current
  only:
    - master
  <<: *check_template
check:r-release:
  image: $REG_URL/release:current
  <<: *check_template
check:r-winbuilder:
  stage: checkWindows
  image: egruw/r-ftp
  only:
    - master
  <<: *build_template
  script:
    - curl -v -T ${PKG}_${VERSION}.tar.gz ftp://win-builder.r-project.org/R-oldrelease/${PKG}_${VERSION}.tar.gz
    - curl -v -T ${PKG}_${VERSION}.tar.gz ftp://win-builder.r-project.org/R-release/${PKG}_${VERSION}.tar.gz
    - curl -v -T ${PKG}_${VERSION}.tar.gz ftp://win-builder.r-project.org/R-devel/${PKG}_${VERSION}.tar.gz
    - mv ./${PKG}_${VERSION}.tar.gz ${PKG}/build/
  tags:
    - docker
  allow_failure: false

release:cran:
  stage: release
  image: egruw/r-ftp
  dependencies:
    - check:r-release
  only:
    - tags
  except:
    - branches
  when: manual
  script:
    - cat cran-comments.md
    - Rscript -e "devtools:::upload_cran(devtools::as.package('.'), './build/rENA_$VERSION.tar.gz')"
  tags:
    - docker
  allow_failure: false

.docker_definition: &docker_template
  stage: docker
  tags:
    - shell
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY/clmarquart/$PKGL/$TAG:current -f inst/docker/${PKG}-$FILE inst/docker/
    - docker push $CI_REGISTRY/clmarquart/$PKGL/$TAG:current
  only:
    refs:
      - develop
    changes:
      - "inst/docker/rENA-$FILE"
docker:release:
  variables:
    TAG: "release"
    FILE: "release"
  <<: *docker_template
docker:old-release:
  variables:
    TAG: "old-release"
    FILE: "oldrelease"
  <<: *docker_template
docker:devel:
  variables:
    TAG: "devel"
    FILE: "devel"
  <<: *docker_template
