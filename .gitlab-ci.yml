stages:
 - check
 - checkWindows
 - deploy
 - release
 - buildAPI
 - docker

variables:
  DEV_HOST: "34.212.25.148"
  STAGING_HOST: "54.201.134.99"
  LIVE_HOST: "54.218.105.250"
  VERSION: "0.1.6.9000"

# Templates
.build_definition: &build_template
  before_script:
    - export _R_CHECK_CRAN_INCOMING_=FALSE
    - export _R_CHECK_FORCE_SUGGESTS_=TRUE
    - mkdir -p build/
    - rm -f ./R/RcppExports.R
    - mkdir -p ~/.R/
    - rm -f ~/.R/Makevars
    - cp demo/backup/Makevars ~/.R/
    - cat ~/.R/Makevars
    - Rscript -e 'Rcpp::compileAttributes()'
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - Rscript -e 'install.packages("webshot", repos = "https://cran.rstudio.com")'
    #- Rscript -e 'devtools::build_vignettes()' || true
    - cd ..; R CMD build --resave-data --no-manual --log rENA || true
.check_definition: &check_template
  stage: check
  artifacts:
    paths:
      - build/
      - doc/
      - inst/doc/
    expire_in: 1 week
  <<: *build_template
  script:
    - R --no-site-file --no-environ --no-save --no-restore --quiet CMD check rENA_$VERSION.tar.gz --as-cran --no-manual
    - ls -al ./
    - ls -al ./rENA.Rcheck/
    - mv ./rENA-00build.log rENA/build/ || true
    - mv ./rENA.Rcheck/00check.log rENA/build/ || true
    - mv ./rENA.Rcheck/00install.out rENA/build/ || true
    - mv ./rENA_$VERSION.tar.gz rENA/build/
  tags:
    - docker
  allow_failure: false

# Check Steps
check:r-devel:
  image: registry.doit.wisc.edu/clmarquart/rena/devel:current
  only:
    - master
  <<: *check_template
check:r-oldrelease:
  image: registry.doit.wisc.edu/clmarquart/rena/old-release:current
  only:
    - master
  <<: *check_template
check:r-release:
  image: registry.doit.wisc.edu/clmarquart/rena/release:current
  only:
    refs:
      - "branches"
    changes:
      - "!inst/docker/*"
  <<: *check_template
check:r-winbuilder:
  stage: checkWindows
  image: egruw/r-ftp
  only:
    - master
  <<: *build_template
  script:
    - curl -v -T rENA_$VERSION.tar.gz ftp://win-builder.r-project.org/R-oldrelease/rENA_$VERSION.tar.gz
    - curl -v -T rENA_$VERSION.tar.gz ftp://win-builder.r-project.org/R-release/rENA_$VERSION.tar.gz
    - curl -v -T rENA_$VERSION.tar.gz ftp://win-builder.r-project.org/R-devel/rENA_$VERSION.tar.gz
    - mv ./rENA_$VERSION.tar.gz rENA/build/
  tags:
    - docker
  allow_failure: false

release:cran:
  stage: release
  image: egruw/r-ftp
  dependencies:
    - check:r-release
  only:
    - tags
  except:
    - branches
  when: manual
  script:
    - cat cran-comments.md
    - Rscript -e "devtools:::upload_cran(devtools::as.package('.'), './build/rENA_$VERSION.tar.gz')"
  tags:
    - docker
  allow_failure: false

docker:
  stage: docker
  tags: shell
  script:
    - docker build -t registry.doit.wisc.edu/clmarquart/rena/release:current inst/docker/rENA-release
  only:
    changes:
      - "inst/docker/*"
      - ".gitlab-ci.yml"
