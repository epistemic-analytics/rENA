stages:
 - docker
 - check
 - test
 - docs
 - checkWindows
 - release

variables:
  VERSION: "0.2.0.1"
  PKG: "rENA"
  PKGL: "rena"

# Templates
.check_condition: &check_condition
  except:
    refs:
      - tags
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[skip check\].*/
.build_definition: &build_template
  before_script:
    - export _R_CHECK_CRAN_INCOMING_="true"
    - export _R_CHECK_CRAN_INCOMING_REMOTE_="true"
    - export _R_CHECK_FORCE_SUGGESTS_="true"
    - export _R_CLASS_MATRIX_ARRAY_="true"
    - export R_REMOTES_STANDALONE="true"
    - export R_REMOTES_NO_ERRORS_FROM_WARNINGS="true"
    - export TZ=Europe/London
    - export _R_CHECK_LENGTH_1_CONDITION_="package:_R_CHECK_PACKAGE_NAME_,verbose"
    - mkdir -p archive/
    - rm -f ./R/RcppExports.R
    - mkdir -p ~/.R/
    - rm -f ~/.R/Makevars
    - cp demo/backup/Makevars ~/.R/
    - cat DESCRIPTION
    - Rscript -e 'Rcpp::compileAttributes()'
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    #- Rscript -e 'install.packages("knitr")'
    #- Rscript -e 'install.packages("rmarkdown")'
    #- Rscript -e 'install.packages("testthat")'
    #- Rscript -e 'devtools::build_vignettes()'
    - cd ..; R CMD build --resave-data --no-manual --log $PKG
.check_definition: &check_template
  stage: check
  artifacts:
    paths:
      - build/
      - archive/
      - doc/
      - inst/doc/
    expire_in: 1 week
  <<: *build_template
  script:
    - R --no-site-file --no-environ --no-save --no-restore --quiet CMD check ${PKG}_${VERSION}.tar.gz --as-cran --no-manual > $PKG/archive/check.log
    - ls -al ./
    - ls -al ./$PKG.Rcheck/ || true
    - mv ./$PKG-00build.log $PKG/archive/ || true
    - mv ./$PKG.Rcheck/00check.log $PKG/archive/ || true
    - mv ./$PKG.Rcheck/00install.out $PKG/archive/ || true
    - mv ./${PKG}_${VERSION}.tar.gz $PKG/archive/
    - cat ${PKG}/archive/check.log || true
    - "tail -n1 ${PKG}/archive/00check.log | grep -iv -e 'Status:.*ERROR' -e 'Status:.*WARNING'"
  allow_failure: false
  <<: *check_condition

# Docker Checks
check:r-devel:
  image: $CI_REGISTRY_IMAGE/devel:current
  <<: *check_template
check:r-oldrelease:
  image: $CI_REGISTRY_IMAGE/old-release:current
  <<: *check_template
check:r-release:
  image: $CI_REGISTRY_IMAGE/release:current
  <<: *check_template
check:r-devel-san:
  image: $CI_REGISTRY_IMAGE/devel-san:current
  <<: *check_template

# WinBuilder Checks
.winbuilder_condition: &winbuilder_condition
  except:
    refs:
      - tags
  only:
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[check winbuilder\].*/
check:r-winbuilder:
  stage: check
  image: $CI_REGISTRY_IMAGE/release-test:current
  <<: *build_template
  script:
    - ls -al
    - ls -al $PKG/archive/ || true
    - mv ./${PKG}_${VERSION}.tar.gz $PKG/archive/
    - curl -v -T $PKG/archive/${PKG}_${VERSION}.tar.gz ftp://win-builder.r-project.org/R-oldrelease/${PKG}_${VERSION}.tar.gz
    - curl -v -T $PKG/archive/${PKG}_${VERSION}.tar.gz ftp://win-builder.r-project.org/R-release/${PKG}_${VERSION}.tar.gz
    - curl -v -T $PKG/archive/${PKG}_${VERSION}.tar.gz ftp://win-builder.r-project.org/R-devel/${PKG}_${VERSION}.tar.gz
  allow_failure: false
  <<: *winbuilder_condition

# Rhub Checks
.rhub_condition: &rhub_condition
  except:
    refs:
      - tags
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[skip rhub\].*/
.rhub_definition: &rhub_definition
  stage: check
  image: $CI_REGISTRY_IMAGE/release:current
  before_script:
    - Rscript -e 'install.packages("rhub")'
  script:
    - |
        Rscript -e "rhub::validate_email(email = \"${RHUB_EMAIL_ADDRESS}\", token = \"${RHUB_EMAIL_TOKEN}\");
                    checked <- rhub::check(
                      platform = \"${RHUB_PLATFORM}\", show_status = TRUE,
                      env_vars = c(\"_R_CHECK_CRAN_INCOMING_\" = \"true\", \"_R_CHECK_CRAN_INCOMING_REMOTE_\" = \"true\", \"_R_CHECK_FORCE_SUGGESTS_\" = \"true\")
                    );
                    checked\$cran_summary();
                    quit(status = ifelse(!checked\$.__enclos_env__\$private\$status_[[1]]\$status %in% c('error', 'warning'), 0, 1));"
  only:
    variables:
      - $RHUB_EMAIL_ADDRESS
      - $RHUB_EMAIL_TOKEN
  <<: *rhub_condition
check:r-hub-windows-old-release:
  variables:
    RHUB_PLATFORM: "windows-x86_64-oldrel"
  <<: *rhub_definition
check:r-hub-windows-release:
  variables:
    RHUB_PLATFORM: "windows-x86_64-release"
  <<: *rhub_definition
check:r-hub-windows-devel:
  variables:
    RHUB_PLATFORM: "windows-x86_64-devel"
  <<: *rhub_definition
check:r-hub-linux-x86_64-rocker-gcc-san:
  variables:
    RHUB_PLATFORM: "linux-x86_64-rocker-gcc-san"
  <<: *rhub_definition
check:r-hub-debian-gcc-devel:
  variables:
    RHUB_PLATFORM: "debian-gcc-devel"
  <<: *rhub_definition
check:r-hub-debian-clang-devel:
  variables:
    RHUB_PLATFORM: "debian-clang-devel"
  <<: *rhub_definition

.release_definition: &release_definition
  stage: release
  image: $REG_URL/release:current
  #dependencies:
  #  - check:r-release
  only:
    refs:
      - tags
    variables:
      - $CI_COMMIT_TAG
  except:
    - branches
    - master
  <<: *build_template
  script:
    - cat ./${PKG}/cran-comments.md || true
    - ls -al || true
    - Rscript -e "devtools:::upload_cran(devtools::as.package(\"${PKG}\"), \"./${PKG}_${VERSION}.tar.gz\")"
    - "curl --request POST --header \"PRIVATE-TOKEN: ${GITLAB_API_TOKEN}\" --data-urlencode \"tag_name=${VERSION}\" --data-urlencode \"name=v${VERSION}\" --data-urlencode \"description=Automatically created from CI for ${VERSION}\" \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases?ref=${CI_COMMIT_REF_NAME}\""
  allow_failure: false
release:cran-manual:
  <<: *release_definition
  when: manual

test:r-release:
  stage: test
  image: $CI_REGISTRY_IMAGE/release-test:current
  script:
    - "sed -i -e \"s/Version: \\(.*\\)/Version: ${VERSION}/\" DESCRIPTION"
    - 'Rscript -e "Rcpp::compileAttributes()"'
    #- 'Rscript -e "rep <- covr::report( x = covr::package_coverage(quiet = T), file = \"inst/coverage/${CI_COMMIT_REF_NAME}/index.html\" )"'
    - |
        Rscript -e "cov <- covr::package_coverage(quiet = F);
                    print(cov);
                    rep <- covr::report( x = cov, file = \"inst/coverage/${CI_COMMIT_REF_NAME}/index.html\", browse = FALSE );"
    - 'Rscript -e "setwd(\"inst/coverage/${CI_COMMIT_REF_NAME}\"); res = lapply(dir(\".\", full.names = F, recursive = T), function(f) { aws.s3::put_object(file = f, object = paste0(\"coverage/${CI_COMMIT_REF_NAME}/\", f), bucket = \"${PKGL}.qe-libs.org\", acl = \"public-read\") })"'
    #- 'Rscript --vanilla demo/backup/coverage-report.R ${CI_COMMIT_REF_NAME}'
  #dependencies:
  #  - check:r-release

docs:build-site:
  stage: docs
  image: $CI_REGISTRY_IMAGE/release-test:current
  script:
    - rm -rf src/RcppExports*
    - rm -rf R/RcppExports*
    - "sed -i -e \"s/Version: \\(.*\\)/Version: ${VERSION}/\" DESCRIPTION"
    - 'Rscript -e "Rcpp::compileAttributes()"'
    - 'Rscript -e "devtools::install(\".\", quick = T, build = T, dependencies = F, upgrade = F)"'
    - 'Rscript -e "pkgdown::build_site(preview = F, document = F, lazy = T, new_process = T)"'
    - 'Rscript -e "setwd(\"docs\"); res = lapply(dir(\".\", full.names = F, recursive = T), function(f) { aws.s3::put_object(file = f, object = f, bucket = \"${PKGL}.qe-libs.org\", acl = \"public-read\") })"'
  dependencies:
    - test:r-release

# Docker Image steps
.docker_variables: &docker_variables
  DOCKER_HOST: tcp://localhost:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
.docker_definition: &docker_template
  stage: docker
  image: docker:19.03.1
  services:
    - docker:19.03.1-dind
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/$TAG:current -f inst/docker/${PKG}-${FILE} inst/docker/
    - docker push $CI_REGISTRY_IMAGE/$TAG:current
  only:
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[build docker\].*/ || $DOCKER_FORCE_REBUILD
