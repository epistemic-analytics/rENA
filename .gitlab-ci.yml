stages:
 - check
 - checkWindows
 - release
 - buildAPI

variables:
  DEV_HOST: "34.212.25.148"
  STAGING_HOST: "54.201.134.99"
  LIVE_HOST: "54.218.105.250"
  VERSION: "0.1.6"

before_script:
  - export _R_CHECK_CRAN_INCOMING_=FALSE
  - export _R_CHECK_FORCE_SUGGESTS_=TRUE
  - mkdir -p build/

check:r-devel:
  stage: check
  image: egruw/rena-r-devel:latest
  artifacts:
    paths:
      - build/
    expire_in: 1 week
  only:
    - master
  script:
    - rm -f ./R/RcppExports.R
    - mkdir -p ~/.R/
    - rm -f ~/.R/Makevars
    - cp demo/backup/Makevars ~/.R/
    - cat ~/.R/Makevars
    - Rscript -e 'Rcpp::compileAttributes()'
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - cd ..; R CMD build --resave-data --no-manual --log rENA || true
    - R --no-site-file --no-environ --no-save --no-restore --quiet CMD check rENA_$VERSION.tar.gz --as-cran --no-manual
    - mv ./rENA-00build.log rENA/build/ || true
    - mv ./rENA.Rcheck/00check.log rENA/build/ || true
    - mv ./rENA.Rcheck/00install.out rENA/build/ || true
    - mv ./rENA_$VERSION.tar.gz rENA/build/
  tags:
    - docker
  allow_failure: false
check:r-oldrelease:
  stage: check
  image: egruw/rena-r-oldrelease:latest
  artifacts:
    paths:
      - build/
    expire_in: 1 week
  only:
    - master
  script:
    - rm -f ./R/RcppExports.R
    - mkdir -p ~/.R/
    - rm -f ~/.R/Makevars
    - cp demo/backup/Makevars ~/.R/
    - cat ~/.R/Makevars
    - Rscript -e 'Rcpp::compileAttributes()'
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - cd ..; R CMD build --resave-data --no-manual --log rENA || true
    - R --no-site-file --no-environ --no-save --no-restore --quiet CMD check rENA_$VERSION.tar.gz --as-cran --no-manual
    - mv ./rENA-00build.log rENA/build/ || true
    - mv ./rENA.Rcheck/00check.log rENA/build/ || true
    - mv ./rENA.Rcheck/00install.out rENA/build/ || true
    - mv ./rENA_$VERSION.tar.gz rENA/build/
  tags:
    - docker
  allow_failure: false
check:r-release:
  stage: check
  image: egruw/rena-r-release:latest
  artifacts:
    paths:
      - build/
    expire_in: 1 week
  script:
    - rm -f ./R/RcppExports.R
    - mkdir -p ~/.R/
    - rm -f ~/.R/Makevars
    - cp demo/backup/Makevars ~/.R/
    - cat ~/.R/Makevars
    - Rscript -e 'Rcpp::compileAttributes()'
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - cd ..; R CMD build --resave-data --no-manual --log rENA || true
    - R --no-site-file --no-environ --no-save --no-restore --quiet CMD check rENA_$VERSION.tar.gz --as-cran --no-manual
    - ls -al ./
    - ls -al ./rENA.Rcheck/
    - mv ./rENA-00build.log rENA/build/ || true
    - mv ./rENA.Rcheck/00check.log rENA/build/ || true
    - mv ./rENA.Rcheck/00install.out rENA/build/ || true
    - mv ./rENA_$VERSION.tar.gz rENA/build/
  tags:
    - docker
  allow_failure: false
check:r-winbuilder:
  stage: checkWindows
  image: egruw/r-ftp
  only:
    - master
  when: manual
  script:
    - rm -f ./R/RcppExports.*
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - Rscript -e 'Rcpp::compileAttributes(v=T)'
    - cd ..; R CMD build --resave-data --no-manual --log rENA || true
    - curl -v -T rENA_$VERSION.tar.gz ftp://win-builder.r-project.org/R-oldrelease/rENA_$VERSION.tar.gz
    - curl -v -T rENA_$VERSION.tar.gz ftp://win-builder.r-project.org/R-release/rENA_$VERSION.tar.gz
    - curl -v -T rENA_$VERSION.tar.gz ftp://win-builder.r-project.org/R-devel/rENA_$VERSION.tar.gz
    - mv ./rENA_$VERSION.tar.gz rENA/build/
  tags:
    - docker
  allow_failure: false
r-upload:
  stage: release
  image: egruw/r-ftp
  only:
    - develop
  when: manual
  script:
    - cat cran-comments.md
    - Rscript -e "devtools:::upload_cran(devtools::as.package("."), './build/rENA_$VERSION.tar.gz')"
  tags:
    - docker
  allow_failure: false

