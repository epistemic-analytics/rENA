.release_build_definition: &release_build_template
  before_script:
    - export _R_CHECK_CRAN_INCOMING_="true"
    - export _R_CHECK_CRAN_INCOMING_REMOTE_="true"
    - export _R_CHECK_FORCE_SUGGESTS_="true"
    - export _R_CLASS_MATRIX_ARRAY_="true"
    - export R_REMOTES_STANDALONE="true"
    - export R_REMOTES_NO_ERRORS_FROM_WARNINGS="true"
    - export TZ=Europe/London
    - export _R_CHECK_LENGTH_1_CONDITION_="package:_R_CHECK_PACKAGE_NAME_,verbose"
    - mkdir -p archive/
    - rm -f ./R/RcppExports.R
    - mkdir -p ~/.R/
    - rm -f ~/.R/Makevars
    - cp demo/backup/Makevars ~/.R/
    - cat DESCRIPTION
    - R -e 'Rcpp::compileAttributes()'
    - R -e 'update(devtools::dev_package_deps("."))'
    - R -e 'devtools::install_dev_deps()'
    - R -e 'devtools::install_deps()'
    - R -e 'install.packages("magrittr")'
    - R -e 'install.packages("R6")'
    - R -e 'install.packages("codetools")'
    - R -e 'install.packages("digest")'
    - cd ..; R CMD build --resave-data --no-manual --log $PKG
.release_definition: &release_definition
  stage: release
  image: $REG_URL/release:current
  #dependencies:
  #  - check:r-release
  only:
    refs:
      - tags
    variables:
      - $CI_COMMIT_TAG
  except:
    - branches
    - master
  <<: *release_build_template
  script:
    - cat ./${PKG}/cran-comments.md || true
    - ls -al || true
    - Rscript -e "devtools:::upload_cran(devtools::as.package(\"${PKG}\"), \"./${PKG}_${VERSION}.tar.gz\")"
    - "curl --request POST --header \"PRIVATE-TOKEN: ${GITLAB_API_TOKEN}\" --data-urlencode \"tag_name=${VERSION}\" --data-urlencode \"name=v${VERSION}\" --data-urlencode \"description=Automatically created from CI for ${VERSION}\" \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases?ref=${CI_COMMIT_REF_NAME}\""
  allow_failure: false
release:cran-manual:
  <<: *release_definition
  when: manual

coverage:
  stage: deploy
  image: $REG_URL/release-test:current
  artifacts:
    paths:
      - public/
    expire_in: 30 days
  script:
    - rm -rf src/RcppExports*
    - rm -rf R/RcppExports*
    - "sed -i -e \"s/Version: \\(.*\\)/Version: ${VERSION}/\" DESCRIPTION"
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - Rscript -e 'install.packages("microbenchmark")'
    - Rscript -e 'Rcpp::compileAttributes()'
    - Rscript -e "devtools::install(\".\", quick = T, build = T, dependencies = F, upgrade = F)"
    - |
        Rscript -e "cov <- covr::package_coverage(quiet = F);
                    print(cov);
                    rep <- covr::report( x = cov, file = \"public/coverage/index.html\", browse = FALSE );"
  only:
    refs:
      - master
    # variables:
    #   - $CI_COMMIT_MESSAGE =~ /.*\[build pages\].*/
  except:
    refs:
      - tags

release:cranqe:
  stage: release
  image: rocker/tidyverse:4.0.3
  artifacts:
    paths:
      - archive/
      - ${PKG}/
    expire_in: 1 week
  only:
    refs:
      - master
  before_script:
    - apt update && apt install -y curl libxt-dev
  script:
    - R --version
    - export VERSION_TIMESTAMP=$(date +%y%m%d%H%M)
    - echo $VERSION_TIMESTAMP
    - "sed -i -e \"s/Version: \\(.*\\)/Version: ${VERSION}.${VERSION_TIMESTAMP}/\" DESCRIPTION"
    - Rscript -e 'install.packages("pkgdown")'
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - mkdir -p archive/
    - cd ..; R CMD build --resave-data --no-manual --log $PKG
    - mv ./${PKG}_${VERSION}.${VERSION_TIMESTAMP}.tar.gz $PKG/archive/
    - cd $PKG/
    # - |
    #     Rscript -e "cov <- covr::package_coverage(quiet = F);
    #                 rep <- covr::report( x = cov, file = \"public/coverage/index.html\", browse = FALSE );"
    - Rscript -e 'pkgdown::build_site()'
    - ls -al $PKG/
    - mv public/* $PKG/
    - curl --request POST --form "token=$CI_JOB_TOKEN" --form "variables[QE_PROJECT_NAME]=${PKG}" --form "variables[QE_PROJECT_ID]=${CI_PROJECT_ID}" --form ref=master https://gitlab.com/api/v4/projects/22522458/trigger/pipeline



