stages:
 - docker
 - check
 - deploy
 - release

variables:
  VERSION: "0.2.3"
  PKG: "rENA"
  PKGL: "rena"
  REG_URL: "${CI_REGISTRY}/epistemic-analytics/qe-packages/rena"

# Templates
.check_condition: &check_condition
  #except:
  #  refs:
  #    - tags
  #  variables:
  #    - $CI_COMMIT_MESSAGE =~ /.*\[skip check\].*/
  except:
    refs:
      - tags
  only:
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[check docker\].*/
.build_definition: &build_template
  before_script:
    - export _R_CHECK_CRAN_INCOMING_="true"
    - export _R_CHECK_CRAN_INCOMING_REMOTE_="true"
    - export _R_CHECK_FORCE_SUGGESTS_="true"
    - export _R_CLASS_MATRIX_ARRAY_="true"
    - export R_REMOTES_STANDALONE="true"
    - export R_REMOTES_NO_ERRORS_FROM_WARNINGS="true"
    - export TZ=Europe/London
    - export _R_CHECK_LENGTH_1_CONDITION_="package:_R_CHECK_PACKAGE_NAME_,verbose"
    - mkdir -p archive/
    - rm -f ./R/RcppExports.R
    - mkdir -p ~/.R/
    - rm -f ~/.R/Makevars
    - cp demo/backup/Makevars ~/.R/
    - cat DESCRIPTION
    - RDsan -e 'Rcpp::compileAttributes()'
    - RDsan -e 'update(devtools::dev_package_deps("."))'
    - RDsan -e 'devtools::install_dev_deps()'
    - RDsan -e 'devtools::install_deps()'
    - RDsan -e 'install.packages("magrittr")'
    - RDsan -e 'install.packages("R6")'
    - RDsan -e 'install.packages("codetools")'
    - RDsan -e 'install.packages("digest")'
    - cd ..; RDsan CMD build --resave-data --no-manual --log $PKG
.check_definition: &check_template
  stage: check
  artifacts:
    paths:
      - build/
      - archive/
      - doc/
      - inst/doc/
    expire_in: 1 week
  <<: *build_template
  script:
    - RDsan --no-site-file --no-environ --no-save --no-restore --quiet CMD check ${PKG}_${VERSION}.tar.gz --as-cran --no-manual > $PKG/archive/check.log || true
    - ls -al ./
    - ls -al ./$PKG.Rcheck/ || true
    - cat ./$PKG.Rcheck/00install.out || true
    - mv ./$PKG-00build.log $PKG/archive/ || true
    - mv ./$PKG.Rcheck/00check.log $PKG/archive/ || true
    - mv ./$PKG.Rcheck/00install.out $PKG/archive/ || true
    - mv ./$PKG.Rcheck/* $PKG/archive/ || true
    - mv ./${PKG}_${VERSION}.tar.gz $PKG/archive/
    - ls -al $PKG/archive/ || true
    - ls -al $PKG/archive/tests/ || true
    - cat ${PKG}/archive/check.log || true
    - cat ${PKG}/archive/tests/testthat.Rout || true
    - cat ${PKG}/archive/tests/testthat.Rout.fail || true
    - tail -n10 ${PKG}/archive/00check.log || true
    - "tail -n10 ${PKG}/archive/00check.log | grep -iv -e 'Status:.*ERROR' -e 'Status:.*WARNING'"
    - "cat ${PKG}/archive/tests/testthat.Rout | grep -iv -e 'runtime error'"
  allow_failure: false
  <<: *check_condition

