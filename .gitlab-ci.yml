# Docker Image steps
.docker_variables: &docker_variables
  DOCKER_HOST: tcp://localhost:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
.docker_definition: &docker_template
  stage: docker
  image: docker:19.03.1
  services:
    - docker:19.03.1-dind
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/$TAG:current -f inst/docker/${PKG}-${FILE} inst/docker/
    - docker push $CI_REGISTRY_IMAGE/$TAG:current
  only:
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[build docker\].*/ || $DOCKER_FORCE_REBUILD
docker:release:
  variables:
    <<: *docker_variables
    TAG: "release"
    FILE: "release"
  <<: *docker_template
docker:release-test:
  variables:
    <<: *docker_variables
    TAG: "release-test"
    FILE: "release-test"
  <<: *docker_template
docker:old-release:
  variables:
    <<: *docker_variables
    TAG: "old-release"
    FILE: "oldrelease"
  <<: *docker_template
docker:devel:
  variables:
    <<: *docker_variables
    TAG: "devel"
    FILE: "devel"
  <<: *docker_template
docker:devel-san:
  variables:
    <<: *docker_variables
    TAG: "devel-san"
    FILE: "devel-san"
  <<: *docker_template
