stages:
  - test

# ── shared pip cache ──────────────────────────────────────────────────────────
.pip-cache: &pip-cache
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.pip-cache]
    policy: pull-push

# ── R package tests ───────────────────────────────────────────────────────────
test:r:
  stage: test
  image: rocker/r-ver:4.5.0
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        build-essential gfortran
        libxml2-dev libcurl4-openssl-dev libssl-dev
        libopenblas-dev liblapack-dev
    - Rscript -e "install.packages(
        c('R6', 'data.table', 'glmnet', 'scales', 'plotly',
          'testthat', 'knitr', 'rmarkdown',
          'Rcpp', 'RcppArmadillo', 'libqe', 'tma'),
        repos = c(
          'https://qe-libs.org/cran-dev/',
          'https://qe-libs.org/cran/',
          'https://packagemanager.posit.co/cran/__linux__/noble/latest'
        ),
        quiet = TRUE)"
  script:
    - R CMD INSTALL .
    - Rscript -e "testthat::test_local('.', reporter = 'progress')"

# ── Python package tests (qe-ena) ─────────────────────────────────────────────
test:python:
  stage: test
  image: python:3.12-slim
  <<: *pip-cache
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends build-essential cmake libarmadillo-dev
    # Public dependencies from PyPI, then qe-lib from qe-libs.org *only*:
    # --extra-index-url would let pip pick a same-named, higher-versioned
    # package from PyPI instead (qe-lib is not claimed there).
    - pip install --cache-dir .pip-cache numpy pandas pytest
    - pip install --cache-dir .pip-cache --no-deps
        --index-url https://qe-libs.org/py/dev/simple/ qe-lib
  script:
    # ena._libena builds against headers vendored into python/include/
    # (libena from inst/include, libqe from Conan).
    - sh scripts/sync-headers.sh
    - cd python
    - pip install --cache-dir ../.pip-cache ".[dev]"
    # importlib mode tests the installed package: the source tree has no
    # compiled ena._libena.
    - pytest tests/ -v --import-mode=importlib

# ── cranqe integration ────────────────────────────────────────────────────────
# verify-tag-version (.pre, tags):  confirm git tag == DESCRIPTION Version
# trigger-cranqe     (.post, main): request a dev build after every push
# trigger-cranqe-release (.post, tags): request a release build after a tag
include:
  - project: 'epistemic-analytics/qe-packages/cranqe'
    ref: main
    file: '/ci-templates/trigger-cranqe.yml'
  - project: 'epistemic-analytics/qe-packages/cranqe'
    ref: main
    file: '/ci-templates/npm-registry.yml'
