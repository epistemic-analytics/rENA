stages:
 #- image
 - test
 - buildAPI

#variables:
#  CODECOV_TOKEN: "CODECOV_TOKEN_STRING"

before_script:
  - apt-get update -qq
  - apt-get install -y --no-install-recommends libcurl4-openssl-dev libssh2-1-dev libssl-dev git libxml2-dev xml2
  - apt-get install -y --no-install-recommends qpdf pandoc pandoc-citeproc openssh-client
  - export _R_CHECK_CRAN_INCOMING_=FALSE
  - export _R_CHECK_FORCE_SUGGESTS_=TRUE

cache:
  paths:
  - /usr/local/lib/R/site-library

r-base:
  stage: test
  image: r-base:latest
  only:
   - develop
  script:
    - Rscript -e 'install.packages(c("devtools", "roxygen2"))' #, covr))'
    - Rscript -e 'devtools::install_dev_deps()'
    - Rscript -e 'devtools::check()'
    #- Rscript -e 'covr::codecov(type = "all", quiet = FALSE)'
  tags:
    - docker

r-devel:
  stage: test
  image: rocker/r-devel:latest
  cache:
    paths:
    - /usr/local/lib/R/site-library
  only:
    - develop
  script:
    - RDscript -e 'install.packages(c("devtools", "stringi", "roxygen2", "lattice", "Matrix","shiny"))'
    #- RDscript -e 'install.packages(c("roxygen2"))'
    #- RDscript -e 'devtools::install_version("roxygen2", version = "5.0.1", repos = "http://cran.us.r-project.org")'
    #- RDscript -e 'devtools::install_version("hexbin", "DiagrammeR", "Matrix")'
    #- RDscript -e 'install.packages("https://cran.r-project.org/src/contrib/Archive/roxygen2/roxygen2_5.0.1.tar.gz", repos=NULL, type="source")'  
    - RDscript -e 'devtools::install_dev_deps()'
    - RDscript -e 'devtools::check()'
  tags:
    - docker

r-oldrel:
  stage: test
  image: r-base:3.3.1
  only:
    - develop
  script:
    - Rscript -e 'install.packages(c("devtools", "roxygen2"))'
    - Rscript -e 'devtools::install_dev_deps()'
    - Rscript -e 'devtools::check()'
  tags:
    - docker
  allow_failure: true


API-dev:
  stage: buildAPI
  #image: ubuntu
  image: r-base:3.3.1
  only:
    - feature/rENA-api
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client git -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan ec2-34-214-61-174.us-west-2.compute.amazonaws.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # Attempted rsync
    #- sudo apt-get install -y --no-install-recommends rsync
    #- rsync -rvP --exclude=.gitignore --exclude=rENA.Rproj --exclude=..Rcheck/ --exclude=.git/ --exclude=.Rproj.user/ --exclude=.Rhistory -e "ssh -i ~/.ssh/api_key.pem" . api@ec2-34-214-61-174.us-west-2.compute.amazonaws.com:~/rENA
    # Use Tar
    - cd ..; tar -czf rENA-source.tar.gz rENA;
    - scp rENA-source.tar.gz api@ec2-34-214-61-174.us-west-2.compute.amazonaws.com:~/rENA-source.tar.gz
    - ssh -tt api@ec2-34-214-61-174.us-west-2.compute.amazonaws.com "rm -fR ~/rENA/; tar -xf rENA-source.tar.gz -C ~/; rm rENA-source.tar.gz"
    - ssh -tt api@ec2-34-214-61-174.us-west-2.compute.amazonaws.com "sudo rm -fR /usr/local/lib/R/site-library/rENA/"
    # Build and Install rENA from directory
    #- ssh -tt api@ec2-34-214-61-174.us-west-2.compute.amazonaws.com "cd ~/rENA/; cat DESCRIPTION; export file=`sudo Rscript -e 'devtools::build(quiet=F)'`; echo $file; sudo R CMD INSTALL --preclean --no-multiarch $(echo $file | cut -d '"' -f2)"
    - ssh -tt api@ec2-34-214-61-174.us-west-2.compute.amazonaws.com "cd ~/rENA/; cat DESCRIPTION; sudo Rscript -e 'devtools::install()'"
    # Restart services
    - ssh -tt api@ec2-34-214-61-174.us-west-2.compute.amazonaws.com "sudo /etc/init.d/opencpu restart; sudo /etc/init.d/apache2 restart"
    